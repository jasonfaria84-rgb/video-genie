repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check src tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Mypy type check
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: repository-hygiene
        name: Repository hygiene
        entry: uv run --locked python scripts/check_repository_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
