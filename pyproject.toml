[project]
name = "video-genie"
version = "0.1.0"
description = "Agentic multicam video production pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fonttools==4.68.0",
    "mcp==2.3.0",
    "pillow==13.0.0",
    "pydantic==2.14.3",
]

[project.scripts]
videogenie = "videogenie.cli:main"
videogenie-mcp = "videogenie.adapters.mcp_server:main"

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "videogenie"
source-include = ["tests/**", "scripts/*.py", "uv.lock", ".python-version"]
source-exclude = ["tests/test_product_roadmap.py", "scripts/export_product_roadmap.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
]
